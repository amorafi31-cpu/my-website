<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iron Fortress: Tank Defense</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Orbitron', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto;
        }

        .stat-box {
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00d2ff;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 14px;
            text-shadow: 0 0 5px #00d2ff;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: auto;
            overflow-x: auto;
        }

        .tower-btn {
            width: 60px;
            height: 60px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tower-btn.selected {
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .tower-btn img {
            width: 30px;
            height: 30px;
            margin-bottom: 5px;
        }

        .tower-cost {
            font-size: 10px;
            color: #ffd700;
        }

        /* AI Assistant Message */
        #ai-message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }

        h1 {
            font-size: 40px;
            color: #ff4444;
            text-shadow: 0 0 20px red;
            margin-bottom: 10px;
            text-align: center;
        }

        button.main-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(45deg, #ff4444, #aa0000);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        button.main-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="top-bar">
            <div class="stat-box">❤️ <span id="health-display">100</span></div>
            <div class="stat-box">🌊 Wave: <span id="wave-display">1</span></div>
            <div class="stat-box">💰 <span id="money-display">500</span></div>
        </div>
        
        <div id="ai-message">AI: تحلیل مسیر... بهترین نقطه ساخت برج هایلایت شد.</div>

        <div class="bottom-bar" id="tower-selector">
            <!-- Towers will be injected here by JS -->
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>IRON FORTRESS</h1>
        <p style="color: #aaa; margin-bottom: 30px;">TANK DEFENSE PROTOCOL</p>
        <button class="main-btn" onclick="startGame()">START MISSION</button>
    </div>

<script>
/**
 * IRON FORTRESS: TANK DEFENSE
 * Core Engine Written in Vanilla JS
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let gameState = {
    money: 500,
    lives: 100,
    wave: 1,
    active: false,
    selectedTower: null,
    enemies: [],
    towers: [],
    projectiles: [],
    particles: [],
    mapPath: [],
    lastTime: 0
};

// Configuration
const TILE_SIZE = 40;
const FPS = 60;

// Tower Definitions
const TOWER_TYPES = [
    { id: 'cannon', name: 'Tank Cannon', cost: 100, range: 150, damage: 20, rate: 60, color: '#4CAF50', type: 'ground' },
    { id: 'machinegun', name: 'Machine Gun', cost: 250, range: 120, damage: 8, rate: 10, color: '#2196F3', type: 'ground' },
    { id: 'sniper', name: 'Sniper Tower', cost: 400, range: 300, damage: 100, rate: 120, color: '#9C27B0', type: 'all' },
    { id: 'missile', name: 'Missile Launch', cost: 600, range: 200, damage: 50, rate: 90, color: '#FF5722', type: 'air' },
    { id: 'tesla', name: 'Tesla Coil', cost: 800, range: 100, damage: 5, rate: 5, color: '#00BCD4', type: 'ground' } // High fire rate, low dmg
];

// Enemy Definitions
const ENEMY_TYPES = [
    { name: 'Soldier', hp: 30, speed: 1.5, reward: 10, color: '#e74c3c', radius: 8 },
    { name: 'Jeep', hp: 80, speed: 2.5, reward: 25, color: '#f39c12', radius: 12 },
    { name: 'Light Tank', hp: 200, speed: 1.0, reward: 50, color: '#34495e', radius: 15 },
    { name: 'Heavy Tank', hp: 500, speed: 0.6, reward: 100, color: '#2c3e50', radius: 18 },
    { name: 'Boss', hp: 3000, speed: 0.4, reward: 1000, color: '#8e44ad', radius: 25 }
];

// Resize Handling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    generateMap();
}
window.addEventListener('resize', resize);

// --- Map Generation ---
function generateMap() {
    // Simple winding path logic based on screen size
    const w = canvas.width;
    const h = canvas.height;
    
    // Create a fixed path for demo purposes (Start Left -> End Right)
    gameState.mapPath = [
        {x: 0, y: h * 0.2},
        {x: w * 0.3, y: h * 0.2},
        {x: w * 0.3, y: h * 0.7},
        {x: w * 0.7, y: h * 0.7},
        {x: w * 0.7, y: h * 0.3},
        {x: w, y: h * 0.3}
    ];
}

// --- Classes ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 4 - 2;
        this.speedY = Math.random() * 4 - 2;
        this.life = 1.0;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Projectile {
    constructor(x, y, target, damage, type) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.damage = damage;
        this.speed = 8;
        this.active = true;
        this.type = type; // 'bullet', 'missile'
    }

    update() {
        if (!this.target || this.target.hp <= 0) {
            this.active = false;
            return;
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < this.speed) {
            this.hit();
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    hit() {
        this.active = false;
        this.target.takeDamage(this.damage);
        createExplosion(this.x, this.y, 5, '#ffff00');
    }

    draw(ctx) {
        ctx.fillStyle = this.type === 'missile' ? '#ff4444' : '#ffff00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Enemy {
    constructor(typeDef) {
        this.pathIndex = 0;
        this.x = gameState.mapPath[0].x;
        this.y = gameState.mapPath[0].y;
        this.hp = typeDef.hp + (gameState.wave * typeDef.hp * 0.2); // Scaling difficulty
        this.maxHp = this.hp;
        this.speed = typeDef.speed;
        this.reward = typeDef.reward;
        this.color = typeDef.color;
        this.radius = typeDef.radius;
        this.frozen = 0;
    }

    move() {
        const target = gameState.mapPath[this.pathIndex + 1];
        if (!target) return; // End of path

        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < this.speed) {
            this.x = target.x;
            this.y = target.y;
            this.pathIndex++;
            if (this.pathIndex >= gameState.mapPath.length - 1) {
                this.reachBase();
            }
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            gameState.money += this.reward;
            updateUI();
            createExplosion(this.x, this.y, 15, this.color);
            // Remove enemy
            const idx = gameState.enemies.indexOf(this);
            if (idx > -1) gameState.enemies.splice(idx, 1);
        }
    }

    reachBase() {
        gameState.lives -= 10;
        updateUI();
        const idx = gameState.enemies.indexOf(this);
        if (idx > -1) gameState.enemies.splice(idx, 1);
        
        // Screen shake effect
        canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
        setTimeout(() => canvas.style.transform = 'none', 100);

        if (gameState.lives <= 0) gameOver();
    }

    draw(ctx) {
        // Draw Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        if (this.radius > 15) {
             // Tank shape
             ctx.rect(this.x - this.radius, this.y - this.radius/2, this.radius*2, this.radius);
        } else {
             ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        }
        ctx.fill();

        // Health Bar
        const hpPct = this.hp / this.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20, 4);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20 * hpPct, 4);
    }
}

class Tower {
    constructor(x, y, typeDef) {
        this.x = x;
        this.y = y;
        this.type = typeDef;
        this.cooldown = 0;
        this.angle = 0;
    }

    update() {
        if (this.cooldown > 0) this.cooldown--;

        // Find Target
        let target = null;
        let minDist = Infinity;

        // Simple targeting: Closest enemy
        for (const enemy of gameState.enemies) {
            const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
            if (dist <= this.type.range) {
                // Check type restriction (Air vs Ground)
                if (this.type.type === 'ground' && enemy.radius > 15) continue; // Simplified logic
                if (this.type.type === 'air' && enemy.radius < 15) continue; 

                if (dist < minDist) {
                    minDist = dist;
                    target = enemy;
                }
            }
        }

        if (target) {
            // Rotate turret
            this.angle = Math.atan2(target.y - this.y, target.x - this.x);

            if (this.cooldown <= 0) {
                this.shoot(target);
                this.cooldown = this.type.rate;
            }
        }
    }

    shoot(target) {
        gameState.projectiles.push(new Projectile(this.x, this.y, target, this.type.damage, this.type.id));
        // Recoil effect could go here
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Base
        ctx.fillStyle = '#333';
        ctx.fillRect(-15, -15, 30, 30);

        // Turret Rotation
        ctx.rotate(this.angle);
        
        // Barrel
        ctx.fillStyle = this.type.color;
        ctx.fillRect(0, -5, 25, 10);
        
        // Body
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Range indicator (only if mouse hover - simplified to always off for performance)
    }
}

// --- Systems ---

function createExplosion(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        gameState.particles.push(new Particle(x, y, color));
    }
}

function spawnWave() {
    if (!gameState.active) return;

    let count = 5 + gameState.wave * 2;
    let spawned = 0;
    
    const interval = setInterval(() => {
        if (!gameState.active) { clearInterval(interval); return; }
        
        let typeIdx = 0;
        if (gameState.wave % 10 === 0 && spawned === 0) {
            // Boss Wave
             gameState.enemies.push(new Enemy(ENEMY_TYPES[4]));
             showAIMessage("WARNING: BOSS DETECTED!");
        } else {
            // Normal waves mix
            if (gameState.wave > 3) typeIdx = Math.floor(Math.random() * 2);
            if (gameState.wave > 6) typeIdx = Math.floor(Math.random() * 3);
            
            gameState.enemies.push(new Enemy(ENEMY_TYPES[typeIdx]));
        }

        spawned++;
        if (spawned >= count) {
            clearInterval(interval);
            // Next wave timer
            setTimeout(() => {
                gameState.wave++;
                updateUI();
                spawnWave();
                showAIMessage(`Wave ${gameState.wave} Started. Analyzing threats...`);
            }, 15000); // 15 seconds break
        }
    }, 1000 - (gameState.wave * 20)); // Faster spawns each wave
}

function gameLoop(timestamp) {
    if (!gameState.active) return;

    // Clear
    ctx.fillStyle = '#1a1a1a'; // Background color
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Map Path
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 40;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (gameState.mapPath.length > 0) {
        ctx.moveTo(gameState.mapPath[0].x, gameState.mapPath[0].y);
        for (let i = 1; i < gameState.mapPath.length; i++) {
            ctx.lineTo(gameState.mapPath[i].x, gameState.mapPath[i].y);
        }
    }
    ctx.stroke();

    // Draw Path Line (Center)
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Update & Draw Towers
    gameState.towers.forEach(t => {
        t.update();
        t.draw(ctx);
    });

    // Update & Draw Enemies
    gameState.enemies.forEach(e => {
        e.move();
        e.draw(ctx);
    });

    // Update & Draw Projectiles
    for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
        let p = gameState.projectiles[i];
        p.update();
        p.draw(ctx);
        if (!p.active) gameState.projectiles.splice(i, 1);
    }

    // Update & Draw Particles
    for (let i = gameState.particles.length - 1; i >= 0; i--) {
        let p = gameState.particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) gameState.particles.splice(i, 1);
    }

    // Placement Preview
    if (gameState.selectedTower) {
        // Draw range circle at mouse pos (handled in click event usually, but simple here)
    }

    requestAnimationFrame(gameLoop);
}

// --- Interaction ---

function initUI() {
    const container = document.getElementById('tower-selector');
    TOWER_TYPES.forEach(t => {
        const btn = document.createElement('div');
        btn.className = 'tower-btn';
        btn.innerHTML = `<div style="width:20px;height:20px;background:${t.color};border-radius:50%"></div><span class="tower-cost">$${t.cost}</span>`;
        btn.onclick = () => selectTower(t, btn);
        container.appendChild(btn);
    });
}

function selectTower(type, btnElement) {
    if (gameState.selectedTower === type) {
        gameState.selectedTower = null;
        btnElement.classList.remove('selected');
    } else {
        document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
        gameState.selectedTower = type;
        btnElement.classList.add('selected');
        showAIMessage(`Selected: ${type.name}. Tap map to place.`);
    }
}

canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', (e) => {
    // Prevent default touch actions
    // e.preventDefault(); 
    const touch = e.touches[0];
    handleInput({ clientX: touch.clientX, clientY: touch.clientY });
}, {passive: false});

function handleInput(e) {
    if (!gameState.active || !gameState.selectedTower) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Check if enough money
    if (gameState.money < gameState.selectedTower.cost) {
        showAIMessage("Insufficient Funds!");
        return;
    }

    // Check collision with path (Simple distance check)
    // In a real grid system, we check tile occupancy. Here we check distance to path segments.
    let onPath = false;
    // Simplified: Just allow placement anywhere not on another tower for this prototype
    
    // Check overlap with other towers
    for (const t of gameState.towers) {
        if (Math.hypot(t.x - x, t.y - y) < 30) return;
    }

    // Place Tower
    gameState.money -= gameState.selectedTower.cost;
    gameState.towers.push(new Tower(x, y, gameState.selectedTower));
    updateUI();
    createExplosion(x, y, 10, '#ffffff'); // Build effect
    
    // Deselect
    gameState.selectedTower = null;
    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
}

function updateUI() {
    document.getElementById('money-display').innerText = Math.floor(gameState.money);
    document.getElementById('health-display').innerText = gameState.lives;
    document.getElementById('wave-display').innerText = gameState.wave;
}

function showAIMessage(text) {
    const el = document.getElementById('ai-message');
    el.innerText = "AI ASSISTANT: " + text;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; }, 3000);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    resize();
    initUI();
    gameState.active = true;
    gameState.money = 500;
    gameState.lives = 100;
    gameState.wave = 1;
    updateUI();
    showAIMessage("Mission Started. Defend the fortress!");
    spawnWave();
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameState.active = false;
    alert("GAME OVER! The fortress has fallen.");
    location.reload();
}

</script>
</body>
</html>
